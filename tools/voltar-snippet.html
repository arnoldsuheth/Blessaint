<!-- VOLTAR-BLS: botão voltar nas páginas e dentro das janelas (pedido/tamanho e produto). O voltar do celular também fecha a janela. -->
<style id="voltar-bls-css">
  .bls-voltar{position:fixed;top:14px;left:18px;z-index:60;display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;border:1px solid rgba(242,237,224,.28);background:rgba(17,17,17,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#F2EDE0;font:700 10px/1 inherit;font-family:inherit;letter-spacing:2px;text-decoration:none;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.45);transition:border-color .3s,background-color .3s}
  .bls-voltar:hover{border-color:#F2EDE0;background:rgba(17,17,17,.9)}
  .bls-voltar svg,.bls-voltar-j svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
  .bls-voltar:hover svg,.bls-voltar-j:hover svg{transform:translateX(-3px)}
  .bls-voltar:active svg,.bls-voltar-j:active svg{transform:translateX(-5px)}
  .bls-voltar-j{position:absolute;top:12px;left:14px;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 8px;border-radius:999px;border:1px solid rgba(242,237,224,.25);background:transparent;color:#F2EDE0;font:700 10px/1 inherit;font-family:inherit;letter-spacing:2px;cursor:pointer}
  .bls-voltar-j:hover{border-color:#F2EDE0}
  .pg-caixa,.v360-caixa{position:relative}
  .pg-caixa{padding-top:56px!important}
  .v360-caixa{padding-top:56px!important}
  @media (max-width:700px){.bls-voltar{top:56px;left:8px;padding:6px 9px 6px 7px;font-size:8px;letter-spacing:1.5px;gap:4px}.bls-voltar svg{width:14px;height:14px}}
</style>
<script id="voltar-bls-js">
(function(){
  var SETA='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>';
  var pagina=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  var home=(pagina===''||pagina==='index.html');
  // 1) botão VOLTAR da página (menos na página inicial)
  if(!home&&!document.querySelector('.bls-voltar')){
    var b=document.createElement('a');b.className='bls-voltar';b.href='index.html';b.setAttribute('aria-label','Voltar');b.innerHTML=SETA+'<span>VOLTAR</span>';
    b.addEventListener('click',function(e){
      var mesmoSite=false;try{mesmoSite=document.referrer&&new URL(document.referrer).origin===location.origin}catch(x){}
      if(mesmoSite&&history.length>1){e.preventDefault();history.back()}
    });
    document.body.appendChild(b);
  }
  // 2) janelas: VOLTAR dentro delas + voltar do celular fecha a janela
  var JANELAS=[{id:'v360-janela',cls:'aberta',caixa:'.v360-caixa',fechar:'#v360-fechar'},{id:'pg-fundo',cls:'aberto',caixa:'.pg-caixa',fechar:'.pg-fechar'}];
  var pilha=[],ignorarPop=0,fechandoPeloVoltar=null;
  JANELAS.forEach(function(j){
    var el=document.getElementById(j.id);if(!el)return;j.el=el;
    var cx=el.querySelector(j.caixa);
    if(cx&&!cx.querySelector('.bls-voltar-j')){
      var v=document.createElement('button');v.type='button';v.className='bls-voltar-j';v.setAttribute('aria-label','Voltar');v.innerHTML=SETA+'<span>VOLTAR</span>';
      v.addEventListener('click',function(e){e.stopPropagation();fecharJ(j)});
      cx.insertBefore(v,cx.firstChild);
    }
    var aberta=el.classList.contains(j.cls);
    new MutationObserver(function(){
      var agora=el.classList.contains(j.cls);if(agora===aberta)return;aberta=agora;
      if(agora){pilha.push(j);try{history.pushState({blsJanela:j.id},'')}catch(x){}}
      else{
        var i=pilha.indexOf(j);if(i>=0)pilha.splice(i,1);
        if(fechandoPeloVoltar===j){fechandoPeloVoltar=null;return}
        if(history.state&&history.state.blsJanela===j.id){ignorarPop++;history.back()}
      }
    }).observe(el,{attributes:true,attributeFilter:['class']});
  });
  function fecharJ(j){var f=j.el.querySelector(j.fechar);if(f)f.click();else j.el.classList.remove(j.cls)}
  window.addEventListener('popstate',function(){
    if(ignorarPop){ignorarPop--;return}
    var j=pilha[pilha.length-1];if(!j)return;
    fechandoPeloVoltar=j;fecharJ(j);
  });
})();
</script>
<!-- /VOLTAR-BLS -->
